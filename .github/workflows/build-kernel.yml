name: Build Pure Kernel (no dtb)
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 'android-9.0'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev build-essential \
                              gcc-aarch64-linux-gnu clang libyaml-dev

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=aarch64-linux-gnu-ld

          # 加载 defconfig
          make sprd_sharkl5_defconfig

          # 禁用栈保护器
          scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          scripts/config --disable CONFIG_CC_STACKPROTECTOR
          scripts/config --set-val CONFIG_CC_STACKPROTECTOR_NONE y

          # 禁用 appended dtb（生成纯内核）
          scripts/config --disable CONFIG_APPENDED_DTB

          # 禁用 ftrace（避免 address-of-packed-member 错误）
          scripts/config --disable CONFIG_FTRACE
          scripts/config --disable CONFIG_FUNCTION_TRACER
          scripts/config --disable CONFIG_TRACING
          scripts/config --disable CONFIG_DYNAMIC_FTRACE

          # 禁用 EFI（避免 undefined reference to __efistub_secure_init）
          scripts/config --disable CONFIG_EFI
          scripts/config --disable CONFIG_EFI_STUB
          scripts/config --disable CONFIG_EFI_PARTITION

          # 彻底移除 yamltree 相关代码
          # sed -i '/yamltree\.o/d' scripts/dtc/Makefile
          # sed -i 's/dt_to_yaml(/\/\/ dt_to_yaml(/g' scripts/dtc/dtc.c

          # 编译内核
          make -j$(nproc) KCFLAGS="-Wno-error=sizeof-pointer-memaccess -Wno-error=restrict -Wno-stringop-overflow -Wno-error=stringop-overflow -Wno-builtin-declaration-mismatch -Wno-error=builtin-declaration-mismatch -Wno-address-of-packed-member -Wno-array-bounds -Wno-error=array-bounds"

      - name: Locate pure kernel image
        id: locate
        run: |
          if [ -f arch/arm64/boot/Image.gz ]; then
            echo "kernel_path=arch/arm64/boot/Image.gz" >> $GITHUB_OUTPUT
          elif [ -f arch/arm64/boot/Image ]; then
            echo "kernel_path=arch/arm64/boot/Image" >> $GITHUB_OUTPUT
          else
            echo "No kernel image found!"
            exit 1
          fi

      - name: Create Release and Upload Kernel
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_title }}
          files: ${{ steps.locate.outputs.kernel_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
