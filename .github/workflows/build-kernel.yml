name: Build Kernel with System Toolchain
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0)'
        required: true
        default: 'latest'
      release_title:
        description: 'Release title'
        required: true
        default: 'Kernel build'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev build-essential gcc-aarch64-linux-gnu clang

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          # 确保使用系统 GCC 的 as 和 ld
          export LD=aarch64-linux-gnu-ld

          # 加载 defconfig
          make sprd_sharkl5_defconfig

          # 禁用栈保护器
          scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          scripts/config --disable CONFIG_CC_STACKPROTECTOR
          scripts/config --set-val CONFIG_CC_STACKPROTECTOR_NONE y

          # 编译
          make -j$(nproc)

      - name: Locate kernel image
        id: locate
        run: |
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "kernel_path=arch/arm64/boot/Image.gz-dtb" >> $GITHUB_OUTPUT
          elif [ -f arch/arm64/boot/Image.gz ]; then
            echo "kernel_path=arch/arm64/boot/Image.gz" >> $GITHUB_OUTPUT
          else
            echo "No kernel image found!"
            exit 1
          fi

      - name: Create Release and Upload Kernel
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_title }}
          files: ${{ steps.locate.outputs.kernel_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
