name: Build Pure Kernel (no dtb)
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 'android-9.0'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev build-essential \
                              gcc-aarch64-linux-gnu clang libyaml-dev

      - name: Build kernel
        run: |
          # 动态查找 Clang 和 GCC 路径
          CLANG_DIR=$(ls clang | grep -E 'clang-r[0-9]+' | head -1)
          GCC_BIN=$(find gcc -name "aarch64-linux-android-gcc" -type f -exec dirname {} \; -quit)

          if [ -z "$CLANG_DIR" ]; then
            echo "Error: Clang directory not found"
            exit 1
          fi
          if [ -z "$GCC_BIN" ]; then
            echo "Error: GCC binary not found"
            exit 1
          fi

          echo "Clang: clang/$CLANG_DIR/bin"
          echo "GCC: $GCC_BIN"

          export PATH="$GITHUB_WORKSPACE/clang/$CLANG_DIR/bin:$GCC_BIN:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang

          # 加载 defconfig
          make sprd_sharkl5_defconfig

          # 禁用 appended dtb（生成纯内核）
          scripts/config --disable CONFIG_APPENDED_DTB

          # 确保 DTC 启用 YAML 并正确链接 libyaml
          scripts/config --enable CONFIG_DTC_YAML
          # 修改 Makefile 强制链接 libyaml
          if grep -q '^HOSTLDLIBS_dtc' scripts/dtc/Makefile; then
            sed -i 's/^HOSTLDLIBS_dtc.*/HOSTLDLIBS_dtc := -lyaml/' scripts/dtc/Makefile
          else
            echo 'HOSTLDLIBS_dtc := -lyaml' >> scripts/dtc/Makefile
          fi

          # 关闭 -Werror（避免 Clang 警告中断编译）
          export KBUILD_CFLAGS="-Wno-error"

          # 编译内核
          make -j$(nproc) KCFLAGS="-Wno-error=sizeof-pointer-memaccess -Wno-error=restrict -Wno-stringop-overflow -Wno-error=stringop-overflow -Wno-builtin-declaration-mismatch -Wno-error=builtin-declaration-mismatch -Wno-address-of-packed-member -Wno-array-bounds -Wno-error=array-bounds"

      - name: Locate pure kernel image
        id: locate
        run: |
          if [ -f arch/arm64/boot/Image.gz ]; then
            echo "kernel_path=arch/arm64/boot/Image.gz" >> $GITHUB_OUTPUT
          elif [ -f arch/arm64/boot/Image ]; then
            echo "kernel_path=arch/arm64/boot/Image" >> $GITHUB_OUTPUT
          else
            echo "No kernel image found!"
            exit 1
          fi

      - name: Create Release and Upload Kernel
        uses: softprops/action-gh-release@v1
        with:
          tag_name: 1.0
          name: testbuild
          files: ${{ steps.locate.outputs.kernel_path }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
