name: Build Pure Kernel (gcc 4.9)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 'test'
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev build-essential \
                              libyaml-dev

      - name: Download and setup GCC 4.9 toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          git clone --depth=1 --branch=W20.13.3 \
            --filter=blob:none --no-checkout \
            https://github.com/deadman96385/jingpad_android_bsp.git toolchain-tmp
          cd toolchain-tmp
          git sparse-checkout init --cone
          git sparse-checkout set toolchain/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git checkout
          mv toolchain/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
             ../aarch64-linux-android-4.9
          cd ..
          rm -rf toolchain-tmp
          chmod -R a+x $HOME/toolchains/aarch64-linux-android-4.9/bin
          echo "$HOME/toolchains/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          aarch64-linux-android-gcc --version
          aarch64-linux-android-gcc -fstack-protector-strong -c -x c /dev/null -o /dev/null

      - name: Test Telegram connection (text message)
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
            -d "text=🔔 GitHub Actions: Build started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')." | tee /dev/stderr
          echo "If the message above shows 'ok:true', your bot can send messages to the chat."

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          # ===== 1. 配置 & 编译内核本体 =====
          make sprd_sharkl5_s100_defconfig
          scripts/config --disable CONFIG_APPENDED_DTB
          scripts/config --disable CONFIG_EFI
          scripts/config --disable CONFIG_EFI_STUB
          sed -i '/yamltree\.o/d' scripts/dtc/Makefile
          sed -i 's/dt_to_yaml(/\/\/ dt_to_yaml(/g' scripts/dtc/dtc.c
          sed -i '/ifdef CONFIG_CC_STACKPROTECTOR_STRONG/{n;s/stackp-flag :=.*/stackp-flag := -fstack-protector-strong/}' Makefile
          sed -i '/ifdef stackp-name/,/endif/{s/exit 1/true/}' Makefile
          sed -i '/ifdef stackp-check/,/endif/{s/exit 1/true/}' Makefile
          make olddefconfig
          KCFLAGS="-Wno-error=sizeof-pointer-memaccess -Wno-error=array-bounds"
          make -j$(nproc) KCFLAGS="$KCFLAGS" 2>&1 | tee build.log

          # ===== 2. 编译内核内部模块 =====
          make modules 2>&1 | tee -a build.log
          make modules_install INSTALL_MOD_PATH=./modules_out 2>&1 | tee -a build.log

          # ===== 3. 编译外部相机模块（所有需要的子模块） =====
          EXTERNAL_MODULES="modules/common/camera/core \
                            modules/common/camera/sensor \
                            modules/common/camera/flash/flash_drv \
                            modules/common/camera/flash/ocp8137 \
                            modules/common/camera/flash/sc2703s \
                            modules/common/camera/mmdvfs \
                            modules/common/camera/fd \
                            modules/common/camera/cpp"

          # 所有宏（目录名必须和源码实际目录一致）
          EXTRA_ARGS="BSP_BOARD_CAMERA_MODULE_ISP_VERSION=isp2.6"
          EXTRA_ARGS="$EXTRA_ARGS BSP_BOARD_CAMERA_MODULE_CSI_VERSION=receiver_r2p1"
          EXTRA_ARGS="$EXTRA_ARGS BSP_BOARD_CAMERA_MODULE_ISP_ADAPT_VERSION=sharkl5"
          EXTRA_ARGS="$EXTRA_ARGS BSP_BOARD_CAMERA_MODULE_DVFS=sharkl5"
          EXTRA_ARGS="$EXTRA_ARGS BSP_BOARD_CAMERA_MODULE_CPP_VERSION=lite_r4p0"
          EXTRA_ARGS="$EXTRA_ARGS BSP_BOARD_CAMERA_MODULE_FD_VERSION=fd2.0"

          for dir in $EXTERNAL_MODULES; do
            if [ -f "$dir/Kbuild" ] || [ -f "$dir/Makefile" ]; then
              echo "Building external module: $dir"
              make -C . M="$dir" $EXTRA_ARGS modules 2>&1 | tee -a build.log
              make -C . M="$dir" modules_install INSTALL_MOD_PATH=./modules_out 2>&1 | tee -a build.log
            fi
          done
      - name: Locate pure kernel image
        id: locate
        continue-on-error: true
        run: |
          if [ -f arch/arm64/boot/Image.gz ]; then
            echo "kernel_path=arch/arm64/boot/Image.gz" >> $GITHUB_OUTPUT
          elif [ -f arch/arm64/boot/Image ]; then
            echo "kernel_path=arch/arm64/boot/Image" >> $GITHUB_OUTPUT
          else
            echo "No kernel image found!"
            exit 1
          fi

      - name: Send build.log if kernel image not found
        if: steps.locate.outcome == 'failure'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -s -F document=@build.log \
            -F "caption=❌ Build failed: kernel image not found. See build.log for details." \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument?chat_id=${CHAT_ID}"
          exit 1

      - name: Package modules
        run: |
          KERNEL_RELEASE=$(make -s kernelrelease 2>/dev/null | grep -v '^#' | tail -1)
          if [ -z "$KERNEL_RELEASE" ]; then
            echo "Error: Could not get kernel release"
            exit 1
          fi
          echo "Kernel release: $KERNEL_RELEASE"

          echo "KERNEL_RELEASE=$(echo $KERNEL_RELEASE | xargs)" >> $GITHUB_ENV

          MODULES_DIR="modules_out/lib/modules/$KERNEL_RELEASE"
          if [ ! -d "$MODULES_DIR" ]; then
            echo "Error: Modules directory not found at $MODULES_DIR"
            exit 1
          fi
          cd "$MODULES_DIR"
          rm -f source build
          tar -czf ../../../../modules.tar.gz .
          zip -r ../../../../modules.zip .
          cd ../../../..
          ls -lh modules.tar.gz modules.zip

      - name: gzip vmlinux
        run: gzip -9 vmlinux

      - name: Package all artifacts for Telegram (exclude vmlinux.gz)
        run: |
          mkdir -p telegram_artifacts
          cp ${{ steps.locate.outputs.kernel_path }} telegram_artifacts/
          cp modules.tar.gz modules.zip telegram_artifacts/ 2>/dev/null || true
          cp System.map Module.symvers build.log telegram_artifacts/ 2>/dev/null || true
          # vmlinux.gz is too large for Telegram, will be available via Release link
          cd telegram_artifacts
          zip -9 ../all_artifacts.zip *
          cd ..
          echo "Created all_artifacts.zip (without vmlinux.gz)"
          ls -lh all_artifacts.zip

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_id }}
          name: Build - ${{ github.sha }} (${{ github.ref_name }})
          files: |
            ${{ steps.locate.outputs.kernel_path }}
            modules.tar.gz
            modules.zip
            build.log
            System.map
            Module.symvers
            vmlinux.gz
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send artifacts to Telegram (lightweight + Release link)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
          KERNEL_RELEASE: ${{ env.KERNEL_RELEASE }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          export COMMIT_MSG
          python3 -c "
          import os, requests

          bot_token = os.environ['BOT_TOKEN']
          chat_id = os.environ['CHAT_ID']
          kernel_release = os.environ.get('KERNEL_RELEASE', 'unknown').strip()
          commit_msg = os.environ.get('COMMIT_MSG', 'unknown').strip()
          repo = os.environ.get('GITHUB_REPOSITORY', 'unknown')
          ref = os.environ.get('GITHUB_REF_NAME', 'unknown')
          sha = os.environ.get('GITHUB_SHA', 'unknown')[:7]
          run_id = os.environ.get('GITHUB_RUN_ID', 'unknown')

          release_url = f'https://github.com/{repo}/releases/tag/build-{run_id}'

          zip_file = 'all_artifacts.zip'
          if not os.path.exists(zip_file):
              print(f'❌ {zip_file} not found')
              exit(1)

          size = os.path.getsize(zip_file)
          print(f'📤 Sending {zip_file} ({size} bytes)...')

          caption = (
              f'✅ Build completed!\n'
              f'📦 Kernel version: {kernel_release}\n'
              f'📝 Commit: {commit_msg} ({sha})\n'
              f'🌿 Branch: {ref}\n'
              f'📁 Repo: {repo}\n'
              f'📎 Artifacts attached: kernel image, modules, System.map, build.log\n'
              f'📥 Full release (including vmlinux.gz):\n{release_url}'
          )

          with open(zip_file, 'rb') as f:
              resp = requests.post(
                  f'https://api.telegram.org/bot{bot_token}/sendDocument',
                  data={'chat_id': chat_id, 'caption': caption},
                  files={'document': f}
              )
          print(resp.text)
          if resp.ok and resp.json().get('ok'):
              print('✅ Telegram notification sent successfully!')
          else:
              print('❌ Failed to send Telegram.')
              exit(1)
          "
