name: Build Pure Kernel (gcc 4.9)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 'test'
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev build-essential \
                              libyaml-dev

      - name: Download and setup GCC 4.9 toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          git clone --depth=1 --branch=W20.13.3 \
            --filter=blob:none --no-checkout \
            https://github.com/deadman96385/jingpad_android_bsp.git toolchain-tmp
          cd toolchain-tmp
          git sparse-checkout init --cone
          git sparse-checkout set toolchain/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git checkout
          mv toolchain/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
             ../aarch64-linux-android-4.9
          cd ..
          rm -rf toolchain-tmp
          chmod -R a+x $HOME/toolchains/aarch64-linux-android-4.9/bin
          echo "$HOME/toolchains/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          aarch64-linux-android-gcc --version
          aarch64-linux-android-gcc -fstack-protector-strong -c -x c /dev/null -o /dev/null

      # 发送文本消息（增加了时间戳）
      - name: Test Telegram connection (text message)
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_TO }}" \
            -d "text=🔔 GitHub Actions: Build started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')." | tee /dev/stderr
          echo "If the message above shows 'ok:true', your bot can send messages to the chat."

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          make sprd_sharkl5_s100_defconfig
          scripts/config --disable CONFIG_APPENDED_DTB
          scripts/config --disable CONFIG_EFI
          scripts/config --disable CONFIG_EFI_STUB
          sed -i '/yamltree\.o/d' scripts/dtc/Makefile
          sed -i 's/dt_to_yaml(/\/\/ dt_to_yaml(/g' scripts/dtc/dtc.c
          sed -i '/ifdef CONFIG_CC_STACKPROTECTOR_STRONG/{n;s/stackp-flag :=.*/stackp-flag := -fstack-protector-strong/}' Makefile
          sed -i '/ifdef stackp-name/,/endif/{s/exit 1/true/}' Makefile
          sed -i '/ifdef stackp-check/,/endif/{s/exit 1/true/}' Makefile
          make olddefconfig
          KCFLAGS="-Wno-error=sizeof-pointer-memaccess -Wno-error=array-bounds"
          make -j$(nproc) KCFLAGS="$KCFLAGS" 2>&1 | tee build.log
          make modules 2>&1 | tee -a build.log
          make modules_install INSTALL_MOD_PATH=./modules_out 2>&1 | tee -a build.log

      - name: Locate pure kernel image
        id: locate
        run: |
          if [ -f arch/arm64/boot/Image.gz ]; then
            echo "kernel_path=arch/arm64/boot/Image.gz" >> $GITHUB_OUTPUT
          elif [ -f arch/arm64/boot/Image ]; then
            echo "kernel_path=arch/arm64/boot/Image" >> $GITHUB_OUTPUT
          else
            echo "No kernel image found!"
            exit 1
          fi

      - name: Package modules
        run: |
          KERNEL_RELEASE=$(make -s kernelrelease 2>/dev/null | grep -v '^#' | tail -1)
          if [ -z "$KERNEL_RELEASE" ]; then
            echo "Error: Could not get kernel release"
            exit 1
          fi
          echo "Kernel release: $KERNEL_RELEASE"
          
          echo "KERNEL_RELEASE=$(echo $KERNEL_RELEASE | xargs)" >> $GITHUB_ENV

          MODULES_DIR="modules_out/lib/modules/$KERNEL_RELEASE"
          if [ ! -d "$MODULES_DIR" ]; then
            echo "Error: Modules directory not found at $MODULES_DIR"
            exit 1
          fi
          cd "$MODULES_DIR"
          rm -f source build
          tar -czf ../../../../modules.tar.gz .
          zip -r ../../../../modules.zip .
          cd ../../../..
          ls -lh modules.tar.gz modules.zip

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: 1.0
          name: testbuild
          files: |
            ${{ steps.locate.outputs.kernel_path }}
            modules.tar.gz
            modules.zip
            build.log
            System.map
            Module.symvers
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send kernel to Telegram (Python)
        id: telegram_send
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
          KERNEL_FILE: ${{ steps.locate.outputs.kernel_path }}
          KERNEL_RELEASE: ${{ env.KERNEL_RELEASE }}
        run: |
          python3 -c "
          import requests, os, sys

          bot_token = os.environ['BOT_TOKEN']
          chat_id = os.environ['CHAT_ID']
          kernel_file = os.environ['KERNEL_FILE']
          kernel_release = os.environ.get('KERNEL_RELEASE', 'unknown').strip()

          if not os.path.exists(kernel_file):
              print(f'❌ File not found: {kernel_file}')
              sys.exit(1)

          print(f'📤 Sending {kernel_file} ({os.path.getsize(kernel_file)} bytes)...')
          url = f'https://api.telegram.org/bot{bot_token}/sendDocument'
          caption = f'✅ Finished! Kernel: {os.path.basename(kernel_file)}  |  Version: {kernel_release}'
          with open(kernel_file, 'rb') as f:
              files = {'document': f}
              data = {'chat_id': chat_id, 'caption': caption}
              resp = requests.post(url, data=data, files=files)
          print(f'Response: {resp.text}')
          if resp.ok and resp.json().get('ok'):
              print('✅ File sent successfully!')
          else:
              print('❌ Failed to send file.')
              sys.exit(1)
          "
          echo "Done."