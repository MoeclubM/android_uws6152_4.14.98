name: Push cleaned test branch to new private repo

on:
  workflow_dispatch:
    inputs:
      target_repo_name:
        description: '新私有仓库的名字'
        required: true
        default: 'my-cleaned-kernel'

jobs:
  push-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Clone only the test branch (include submodules)
        run: |
          git clone --branch test --single-branch --recurse-submodules \
            https://github.com/${{ github.repository }}.git source
          cd source
          git submodule update --init --recursive  # 确保子模块内容拉取完整

      - name: Create orphan branch to wipe history but keep everything
        run: |
          cd source
          # 创建一个没有任何历史的孤立分支
          git checkout --orphan new_main
          # 清空暂存区（但工作树文件还在）
          git rm -rf --cached .
          # 重新添加所有文件，包括 .github、子模块的 .gitmodules 和 gitlink
          git add -A
          # 使用你配置的账号信息进行提交
          git config user.name "${{ secrets.MY_NAME }}"
          git config user.email "${{ secrets.MY_EMAIL }}"
          git commit -m "Initial commit (history cleared from test branch)"

      - name: Create new private repo and push
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          REPO_NAME: ${{ github.event.inputs.target_repo_name }}
        run: |
          cd source
          # 把当前分支重命名成 main（或保持 new_main，看习惯）
          git branch -M main
          # 用 gh 创建私有仓库并推送（--source=. 会使用当前目录的 main 分支）
          gh repo create $REPO_NAME --private --source=. --remote=origin --push
